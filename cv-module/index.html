<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceBooth CV Debug</title>
  </head>
  <body>
    <header>
      <h1>SpaceBooth · CV debug</h1>
      <div class="actions">
        <button id="btn-cv">Start camera + CV</button>
        <button id="btn-mock">Mock mode (mouse)</button>
        <button id="btn-log">Download log JSON</button>
        <button id="btn-clear">Clear stickers + log</button>
      </div>
      <span id="status">Idle</span>
    </header>
    <main>
      <div id="stage">
        <video id="cam" playsinline muted></video>
        <canvas id="overlay" width="1280" height="720"></canvas>
      </div>
      <aside>
        <pre id="stats"></pre>
        <p class="hint">
          1-4: chọn sticker · M: đánh dấu ý định (ground truth) · X: nhả quyền điều khiển
        </p>
        <ol id="events"></ol>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
